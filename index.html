<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>話題広げ君</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#0f172a;color:#0f172a}
.app{max-width:430px;min-height:100vh;margin:0 auto;background:#f8fafc;padding:22px}
.hero{padding:28px 4px}
.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700}
h1{font-size:38px;line-height:1.1;margin:18px 0 10px}
.lead{font-size:15px;color:#475569;line-height:1.7;margin:0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 12px 28px rgba(15,23,42,.08)}
.btn{width:100%;border:0;border-radius:18px;background:#2563eb;color:#fff;font-size:18px;font-weight:800;padding:17px;margin-top:12px}
.btn.secondary{background:#e2e8f0;color:#0f172a}
.btn.secondary.active{background:#2563eb;color:#fff}
.btn.danger{background:#fee2e2;color:#991b1b}
.progress{font-size:14px;color:#475569;line-height:1.8}
.pref{font-size:13px;color:#64748b;font-weight:700;margin-bottom:6px}
.qtitle{font-size:24px;font-weight:900;line-height:1.35;margin:8px 0 18px}
.choice{width:100%;text-align:left;background:#fff;border:2px solid #e2e8f0;border-radius:16px;padding:16px;margin:10px 0;font-size:16px;font-weight:800;color:#0f172a}
.choice.selected{border-color:#2563eb;background:#eff6ff}
.result-ok{color:#15803d;font-weight:900}
.result-ng{color:#dc2626;font-weight:900}
.info{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-top:14px}
.info h4{margin:0 0 8px;font-size:15px}
.info ul{margin:8px 0 0;padding-left:22px;color:#475569;line-height:1.7}
.hidden{display:none}
</style>
</head>
<body>

<div class="app">

<section id="home">
<div class="hero">
<span class="badge">コミュニケーション力向上APP</span>
<h1>話題広げ君</h1>
<p class="lead">都道府県 × 有名人 × 食べ物 × 名所をクイズで覚える</p>
</div>

<div class="card">
<div class="progress" id="progressText"></div>
<button class="btn" onclick="startQuiz()">開始する</button>
<button class="btn danger" onclick="resetHistory()">履歴をリセット</button>
</div>
</section>

<section id="quiz" class="hidden">
<div class="card">
<div class="pref" id="quizPref"></div>
<div class="qtitle" id="questionText"></div>
<div id="choices"></div>
<button class="btn secondary" id="nextBtn" onclick="nextQuestion()" disabled>次へ</button>
</div>
</section>

<section id="result" class="hidden">
<h2>答え合わせ</h2>
<div id="resultList"></div>
<button class="btn" onclick="startQuiz()">他の都道府県に進む</button>
<button class="btn secondary" onclick="goHome()">トップページに戻る</button>
</section>

</div>

<script>
const DATA = {
"大阪府":{
people:["aiko","槇原敬之","コブクロ黒田俊介","絢香"],
foods:["たこ焼き","お好み焼き","串カツ","かすうどん"],
places:["大阪城","通天閣","道頓堀","あべのハルカス"]
},
"東京都":{
people:["星野源","ビートたけし","松任谷由実","小沢健二"],
foods:["深川めし","もんじゃ焼き","江戸前寿司","人形焼"],
places:["東京タワー","浅草寺","渋谷スクランブル交差点","上野公園"]
},
"北海道":{
people:["玉置浩二","大泉洋","中島みゆき","GLAY"],
foods:["ジンギスカン","海鮮丼","味噌ラーメン","スープカレー"],
places:["札幌時計台","小樽運河","函館山","旭山動物園"]
},
"福岡県":{
people:["椎名林檎","浜崎あゆみ","MISIA","タモリ"],
foods:["もつ鍋","博多ラーメン","明太子","水炊き"],
places:["太宰府天満宮","中洲","門司港レトロ","糸島"]
}
};

const PREFS = Object.keys(DATA);
const doneKey="wadai_done_history";

let currentPref="";
let questions=[];
let answers=[];
let qIndex=0;
let selected="";

function $(id){return document.getElementById(id)}
function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5)}
function getDone(){return JSON.parse(localStorage.getItem(doneKey)||"[]")}
function setDone(v){localStorage.setItem(doneKey,JSON.stringify(v))}

function updateProgress(){
const done=getDone();
$("progressText").innerHTML=`完了：<b>${done.length}</b> / ${PREFS.length}<br>全問正解した都道府県は次回から出題されません`;
}

function startQuiz(){
const done=getDone();
const targets=PREFS.filter(p=>!done.includes(p));
if(targets.length===0){
alert("全都道府県完了です。履歴をリセットしてください。");
return;
}
currentPref=targets[Math.floor(Math.random()*targets.length)];

questions=[
makeQuestion("people","有名人"),
makeQuestion("foods","食べ物"),
makeQuestion("places","名所")
];

answers=[];
qIndex=0;
show("quiz");
renderQuiz();
}

function makeQuestion(type,label){
const list=DATA[currentPref][type];
const correct=list[Math.floor(Math.random()*list.length)];
const choices=shuffle(list).slice(0,4);

if(!choices.includes(correct)){
choices[0]=correct;
}

return{
type:type,
label:label,
correct:correct,
choices:shuffle(choices),
extras:list.filter(v=>v!==correct).slice(0,3)
};
}

function renderQuiz(){
selected="";
$("nextBtn").disabled=true;
$("nextBtn").classList.remove("active");

const q=questions[qIndex];

$("quizPref").textContent=`${currentPref} / 第${qIndex+1}問`;
$("questionText").textContent=`${currentPref}の${q.label}として正しいものは？`;

$("choices").innerHTML=q.choices.map(v=>`
<button class="choice" onclick="selectChoice(this,'${v}')">${v}</button>
`).join("");
}

function selectChoice(btn,val){
selected=val;

document.querySelectorAll(".choice").forEach(el=>{
el.classList.remove("selected");
});

btn.classList.add("selected");

$("nextBtn").disabled=false;
$("nextBtn").classList.add("active");
}

function nextQuestion(){
const q=questions[qIndex];

answers.push({
q:q,
user:selected,
ok:selected===q.correct
});

qIndex++;

if(qIndex<questions.length){
renderQuiz();
}else{
showResult();
}
}

function showResult(){
const allOk=answers.every(a=>a.ok);

if(allOk){
const done=getDone();
if(!done.includes(currentPref)){
done.push(currentPref);
setDone(done);
}
}

$("resultList").innerHTML=answers.map((a,i)=>`
<div class="card">
<div class="${a.ok?'result-ok':'result-ng'}">
${i+1}. ${a.q.label}：${a.ok?'正解':'不正解'}
</div>

<p>あなたの回答：<b>${a.user}</b></p>

${a.ok?'':`<p>正しい回答：<b>${a.q.correct}</b></p>`}

<div class="info">
<h4>他にも以下の${a.q.label}があります</h4>
<ul>
${a.q.extras.map(v=>`<li>${v}</li>`).join("")}
</ul>
</div>
</div>
`).join("");

show("result");
updateProgress();
}

function goHome(){
show("home");
updateProgress();
}

function resetHistory(){
if(confirm("履歴をリセットしますか？")){
localStorage.removeItem(doneKey);
updateProgress();
alert("リセットしました");
}
}

function show(id){
["home","quiz","result"].forEach(v=>{
$(v).classList.add("hidden");
});
$(id).classList.remove("hidden");
}

updateProgress();
show("home");
</script>

</body>
</html>
