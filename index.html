<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>話題広げ君</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#0f172a;color:#0f172a}
.app{max-width:430px;min-height:100vh;margin:0 auto;background:#f8fafc;padding:22px}
.hero{padding:28px 4px}
.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700}
h1{font-size:38px;line-height:1.1;margin:18px 0 10px}
.lead{font-size:15px;color:#475569;line-height:1.7;margin:0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 12px 28px rgba(15,23,42,.08)}
.btn{width:100%;border:0;border-radius:18px;background:#2563eb;color:#fff;font-size:18px;font-weight:800;padding:17px;margin-top:12px}
.btn.secondary{background:#e2e8f0;color:#0f172a}
.btn.danger{background:#fee2e2;color:#991b1b}
.progress{font-size:14px;color:#475569;line-height:1.8}
.pref{font-size:13px;color:#64748b;font-weight:700;margin-bottom:6px}
.qtitle{font-size:24px;font-weight:900;line-height:1.35;margin:8px 0 18px}
.choice{width:100%;text-align:left;background:#fff;border:2px solid #e2e8f0;border-radius:16px;padding:16px;margin:10px 0;font-size:16px;font-weight:800;color:#0f172a}
.choice.selected{border-color:#2563eb;background:#eff6ff}
.result-ok{color:#15803d;font-weight:900}
.result-ng{color:#dc2626;font-weight:900}
.info{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-top:14px}
.info h4{margin:0 0 8px;font-size:15px}
.info ul{margin:8px 0 0;padding-left:22px;color:#475569;line-height:1.7}
.hidden{display:none}
.footer{font-size:12px;color:#94a3b8;text-align:center;margin-top:26px}
</style>
</head>
<body>
<div class="app">
  <section id="home">
    <div class="hero">
      <span class="badge">コミュニケーション力向上APP</span>
      <h1>話題<br>広げ君</h1>
      <p class="lead">都道府県 × 有名人 × 食べ物 × 名所をクイズで覚える</p>
    </div>
    <div class="card">
      <div class="progress" id="progressText"></div>
      <button class="btn" onclick="startQuiz()">開始する</button>
      <button class="btn danger" onclick="resetHistory()">履歴をリセット</button>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="card">
      <div class="pref" id="quizPref"></div>
      <div class="qtitle" id="questionText"></div>
      <div id="choices"></div>
      <button class="btn secondary" onclick="nextQuestion()" id="nextBtn" disabled>次へ</button>
    </div>
  </section>

  <section id="result" class="hidden">
    <h2>答え合わせ</h2>
    <div id="resultList"></div>
    <button class="btn" onclick="goHome()">トップへ戻る</button>
  </section>
</div>

const wrongPool={
people:["桑田佳祐","福山雅治","米津玄師","小田和正","玉置浩二","宇多田ヒカル","あいみょん","桜井和寿","草野マサムネ","藤井風","山下達郎","B'z稲葉浩志"],

places:["東京タワー","清水寺","大阪城","札幌時計台","太宰府天満宮","兼六園","厳島神社","姫路城","出雲大社","富士山","首里城","松島"]
};

let currentPref="",questions=[],answers=[],qIndex=0,selected=null;
const doneKey="wadai_done_prefs_v1";

function $(id){return document.getElementById(id)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function sample(a,n){return shuffle(a).slice(0,n)}
function show(id){["home","quiz","result"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}
function getDone(){return JSON.parse(localStorage.getItem(doneKey)||"[]")}
function setDone(arr){localStorage.setItem(doneKey,JSON.stringify(arr))}

function updateProgress(){
 const done=getDone();
 $("progressText").innerHTML=`完了：<b>${done.length}</b> / 47 都道府県<br>全問正解した都道府県は次回から出題されません。`;
}
updateProgress();

function makeQuestion(pref,type,label){
 const data=DATA[pref][type];
 const correct=data[Math.floor(Math.random()*data.length)];
 const wrong=sample(wrongPool[type].filter(x=>x!==correct&&!data.includes(x)),3);
 const choices=shuffle([correct,...wrong]);
 return {type,label,correct,choices,extras:data.filter(x=>x!==correct).slice(0,3)};
}

function startQuiz(){
 const done=getDone();
 const prefs=Object.keys(DATA).filter(p=>!done.includes(p));
 if(!prefs.length){alert("全都道府県を完了しました。履歴をリセットすると再挑戦できます。");return}
 currentPref=prefs[Math.floor(Math.random()*prefs.length)];
 questions=[
  makeQuestion(currentPref,"people","有名人"),
  makeQuestion(currentPref,"foods","食べ物"),
  makeQuestion(currentPref,"places","名所")
 ];
 answers=[];qIndex=0;renderQuiz();show("quiz");
}

function renderQuiz(){
 selected=null;
 $("nextBtn").disabled=true;
 const q=questions[qIndex];
 $("quizPref").textContent=`${currentPref} / 第${qIndex+1}問`;
 $("questionText").textContent=`${currentPref}の${q.label}として正しいものは？`;
 $("choices").innerHTML=q.choices.map(c=>`<button class="choice" onclick="selectChoice(this,'${c.replace(/'/g,"\\'")}')">${c}</button>`).join("");
}

function selectChoice(btn,val){
 selected=val;
 document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
 btn.classList.add("selected");
 $("nextBtn").disabled=false;
}

function nextQuestion(){
 const q=questions[qIndex];
 answers.push({q,user:selected,ok:selected===q.correct});
 qIndex++;
 if(qIndex<questions.length){renderQuiz()}else{showResult()}
}

function showResult(){
 const allOk=answers.every(a=>a.ok);
 if(allOk){
  const done=getDone();
  if(!done.includes(currentPref)){done.push(currentPref);setDone(done)}
 }
 $("resultList").innerHTML=answers.map((a,i)=>`
 <div class="card">
  <div class="${a.ok?'result-ok':'result-ng'}">${i+1}. ${a.q.label}：${a.ok?'正解':'不正解'}</div>
  <p>あなたの回答：<b>${a.user}</b></p>
  ${a.ok?"":`<p>正しい回答：<b>${a.q.correct}</b></p>`}
  <div class="info">
    <h4>他にも以下の${a.q.label}があります</h4>
    <ul>${a.q.extras.map(x=>`<li>${x}</li>`).join("")}</ul>
  </div>
 </div>`).join("")+
 `<div class="card"><b>${allOk?"全問正解！この都道府県は完了になりました。":"今回は未完了です。もう一度挑戦できます。"}</b></div>`;
 updateProgress();
 show("result");
}
